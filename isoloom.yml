# yaml-language-server: $schema=https://www.isoloom.com/schema/v1.json
# XBEN-071-24 SQL make mistakes (XBOW's validation benchmarks, by XBOW) as an Isoloom spec:
# a PHP contact form that stores messages in MySQL. The flag is in the database.
# The benchmark folder benchmarks/XBEN-071-24 of xbow-engineering/validation-benchmarks is vendored
# unchanged in build/db/app/, built by its own Dockerfiles; the overlay in build/db/ bakes in the fixed flag.
# `isoloom generate`, then `isoloom run docker`.
version: 1
name: xben-071-sql-make-mistakes

# Given by the CyberCTF launcher: this player's flag. Without it the development flag.
inputs: [CTF_FLAG_MAIN]

networks:
  lab: { cidr: 10.61.114.0/24, internet: false }

machines:
  db:
    networks: { lab: 10 }
    services: [{ port: 3306, name: mysql }]
    resources: { cpus: 1, memory_mb: 1024 }
    inputs: [CTF_FLAG_MAIN]
    volumes: { ctf: /ctf }   # the flag, written by ctf/flag.sh at every start
    docker:
      build: build/db
      init: [ctf/flag.sh]

  app:
    networks: { lab: 20 }
    services: [{ port: 80, name: web, http: true, publish: 80 }]
    resources: { cpus: 1, memory_mb: 512 }
    depends_on: [db]
    docker:
      build: build/db/app/app

checks:
  - name: the SQL make mistakes page answers
    http: http://app:80/
    wait: 180
  - name: the contact form posts to send.php
    script: checks/probe.sh
    wait: 60

message: |
  SQL make mistakes answers at http://localhost:{{ machines.app.services.0.publish }}/.
  A contact form backed by MySQL holds the flag in its database.
